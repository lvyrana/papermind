server {
    listen 80;
    listen [::]:80;
    server_name papermindapp.com www.papermindapp.com;

    root /opt/papermind/web/dist;
    index index.html;

    client_max_body_size 50m;

    # 试用期（2026-07-31 起）关闭 HTTP Basic Auth。
    # 原因：多一道密码就多掉几个试用者，而手机上输入密码后仍反复弹框；
    # 数据本身按匿名设备 ID 隔离，别人看不到彼此的书架与笔记，
    # AI 调用另有每日限额兜底。试用结束后运行 toggle-preview-auth.sh on 恢复。
    # auth_basic "PaperMind private preview";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    include /opt/papermind/deploy/nginx-zotero-plugin-location.conf;
    include /opt/papermind/deploy/nginx-mjs-location.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
