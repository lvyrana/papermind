server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PAPERMIND_HOST__;

    root /opt/papermind/web/dist;
    index index.html;

    client_max_body_size 50m;
    # 试用期（2026-07-31 起）关闭，与 nginx-papermind.conf 保持一致；
    # 只关域名那份、留着这份，从 IP 进来仍会弹框。
    # auth_basic "PaperMind private preview";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    include /opt/papermind/deploy/nginx-zotero-plugin-location.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
