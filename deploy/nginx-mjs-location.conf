# pdfjs-dist ships its worker as an ES module. Older nginx mime.types files do
# not know the .mjs extension, and browsers refuse to execute octet-stream modules.
location ~* \.mjs$ {
    auth_basic off;
    types {
        application/javascript mjs;
    }
    default_type application/javascript;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
